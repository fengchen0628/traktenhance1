name: Build Trakt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build:trakt

      - name: Commit and push built artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trakt_simplified_chinese/trakt_simplified_chinese.js \
                  trakt_simplified_chinese/trakt_simplified_chinese.plugin \
                  trakt_simplified_chinese/trakt_simplified_chinese.sgmodule \
                  trakt_simplified_chinese/trakt_simplified_chinese.snippet \
                  boxjs.json
          git diff --cached --quiet || (git commit -m "build(trakt): rebuild artifacts" && git push)
